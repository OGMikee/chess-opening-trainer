services:
  - type: web
    name: chess-opening-trainer-api
    runtime: java
    buildCommand: cd backend && ./mvnw clean package -DskipTests
    startCommand: cd backend && java -jar target/chess-backend-0.0.1-SNAPSHOT.jar
    envVars:
      - key: PORT
        value: 8080
      - key: ALLOWED_ORIGINS
        value: https://chess-opening-trainer.vercel.app
    healthCheckPath: /health